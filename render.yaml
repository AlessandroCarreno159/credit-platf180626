# P8: Blueprint Render (plan Free, 1 instancia). Los secretos se pegan en el dashboard (sync: false).
services:
  - type: web
    name: credit-platf
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # $PORT lo expande la shell de Render. NO poner ${PORT} dentro de una env var.
    startCommand: "ASPNETCORE_URLS=http://0.0.0.0:$PORT dotnet credit-platf.dll"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: "Data Source=/tmp/app.db;Cache=Shared"
      - key: APLICAR_MIGRACIONES
        value: "true"
      - key: Redis__InstanceName
        value: "creditplatf:"
      - key: RabbitMq__QueueName
        value: solicitudes.notificaciones
      - key: RabbitMq__ConsumerEnabled
        value: "true"
      - key: Redis__ConnectionString
        sync: false
      - key: RabbitMq__ConnectionString
        sync: false
      - key: PieSocket__ClusterId
        sync: false
      - key: PieSocket__ApiKey
        sync: false
      - key: PieSocket__ApiSecret
        sync: false
